<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URA守札社</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <h1>URA守札社</h1>
        <p class="subtitle">Umamusume Shared Checklist · 共 <span id="total">145</span> 项</p>
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索名称 / 日文 / 英文…" autocomplete="off" />
        <button id="unlock" type="button">🔒 解锁</button>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="container progress-text">
      <span id="done-count">0</span> 已完成 ·
      <span id="doing-count">0</span> 制作中 ·
      共 <span id="total2">145</span>
    </div>
  </header>

  <main class="container">
    <div id="status-filters" class="status-filters" role="group" aria-label="按制作状态筛选">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="none" aria-pressed="false">未制作</button>
      <button type="button" class="filter-btn" data-filter="doing" aria-pressed="false">制作中</button>
      <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">已完成</button>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>没有匹配的结果</p>
  </main>

  <footer class="footer container">
    <span id="sync-status">加载中…</span> · 查看无需登录，修改需密码
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2>输入密码</h2>
      <p class="modal-tip">修改清单需要密码</p>
      <input id="modal-password" type="password" placeholder="请输入密码" autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel" type="button">取消</button>
        <button id="modal-ok" type="button" class="primary">确定</button>
      </div>
      <p id="modal-error" class="modal-error" hidden>密码错误</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
